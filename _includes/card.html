{% assign kat = site.kategorien | where: 'slug', include.post.kategorie | first %}
<article class="card">
  <a href="{{ include.post.url | relative_url }}">
    {% if include.post.image %}<img src="{{ include.post.image | relative_url }}" alt="" loading="lazy" width="1200" height="630">{% endif %}
    <div class="card-body">
      <span class="pill">{{ kat.name }}</span>
      <h3>{{ include.post.title }}</h3>
      <p class="muted">{{ include.post.description }}</p>
    </div>
  </a>
</article>
